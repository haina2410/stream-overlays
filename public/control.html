<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overlay control</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/host.css">
</head>
<body class="host-control">
  <header class="host-controls">
    <label for="gameSelect">Game</label>
    <select id="gameSelect" aria-label="Active game"></select>
    <span id="serverStatus" class="host-status" role="status">đang kết nối</span>
    <span id="gameError" class="host-error" role="status"></span>
    <span class="host-operator">OBS: <code id="viewerUrl"></code> <button id="copyUrl" type="button">Sao chép URL</button> <a id="openViewer" target="_blank">Mở viewer</a></span>
    <span class="host-operator">OBS Browser: 1920 × 1080. Keep “Shutdown source when not visible” off.</span>
    <span class="host-operator">Điện thoại: <code id="phoneUrls">Cùng mạng Wi-Fi</code></span>
  </header>
  <iframe id="gameFrame" class="host-frame" title="Game control"></iframe>
  <script type="module" src="/dev-reload.js"></script>
  <script type="module" src="/control.js"></script>
</body>
</html>
